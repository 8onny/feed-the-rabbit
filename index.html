<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ODACUIR - FEED ME</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --bg-color: #000000;
      --panel-bg: #111111;
      --border-color: #ffffff;
      --text-main: #ffffff;
      --text-dim: #888888;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      filter: grayscale(100%) contrast(150%);
    }

    /* CRT 舊螢幕掃描線視覺效果 */
    .crt::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(255, 255, 255, 0.05) 50%);
      background-size: 100% 4px;
      z-index: 100;
      pointer-events: none;
    }

    .game-container {
      width: 100%;
      max-width: 360px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    header {
      text-align: center;
      border: 2px solid var(--border-color);
      padding: 12px;
      width: 100%;
      background-color: var(--panel-bg);
      box-shadow: 4px 4px 0px var(--border-color);
    }

    h1 {
      font-size: 10px;
      line-height: 1.4;
      margin: 0;
      letter-spacing: 1px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 8px;
      border: 2px solid var(--border-color);
      padding: 10px;
      background: var(--panel-bg);
      box-shadow: 4px 4px 0px var(--border-color);
    }

    #canvas-container {
      border: 3px solid var(--border-color);
      background-color: #000;
      box-shadow: 6px 6px 0px var(--border-color);
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .controls {
      width: 100%;
    }

    button {
      width: 100%;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--text-main);
      background-color: var(--bg-color);
      border: 2px solid var(--border-color);
      padding: 14px;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--border-color);
      transition: all 0.1s;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border-color);
    }

    button:disabled {
      color: var(--text-dim);
      border-color: var(--text-dim);
      box-shadow: 4px 4px 0px var(--text-dim);
      cursor: not-allowed;
    }
  </style>
</head>
<body class="crt">

  <div class="game-container">
    <header>
      <h1>ODACUIR FEED ME</h1>
    </header>

    <!-- 7天連續紀錄與狀態 -->
    <div class="status-bar">
      <span>STREAK: <span id="streak-count">0</span>/7D</span>
      <span>STATUS: <span id="pet-status">SAD</span></span>
    </div>

    <!-- 兔子畫布 -->
    <div id="canvas-container">
      <canvas id="gameCanvas" width="250" height="250"></canvas>
    </div>

    <!-- 餵食控制按鈕 -->
    <div class="controls">
      <button id="feed-btn" onclick="tryFeed()">[ FEED PET ]</button>
    </div>
  </div>

  <script>
    // 1. 全域變數定義（避免畫面崩潰）
    let streak = parseInt(localStorage.getItem('odacuir_streak') || '0');
    let lastFedTimestamp = parseInt(localStorage.getItem('odacuir_last_fed') || '0');
    let animFrame = 0;
    let isEating = false; // 控制吃東西動畫狀態

    // 2. 8-Bit 蜂鳴器音效 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'square', duration = 0.15) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    // 3. 冷卻時間判定（24小時倒數）
    function isCooldownActive() {
      const now = Date.now();
      return (now - lastFedTimestamp) < (24 * 60 * 60 * 1000);
    }

    function checkCooldown() {
      const feedBtn = document.getElementById('feed-btn');
      if (isCooldownActive()) {
        feedBtn.disabled = true;
        feedBtn.innerText = "[ ALREADY FED ]";
      } else {
        feedBtn.disabled = false;
        feedBtn.innerText = "[ FEED PET ]";
      }
    }

    // 4. 餵食動作邏輯
    function tryFeed() {
      if (isCooldownActive()) return;

      // 如果距離上次餵食超過 48 小時，Streak 自動重置為 0（非必要，但保持連續性）
      const now = Date.now();
      if (lastFedTimestamp > 0 && (now - lastFedTimestamp) > (48 * 60 * 60 * 1000)) {
        streak = 0;
      }

      streak += 1;
      lastFedTimestamp = now;

      // 儲存至本地瀏覽器
      localStorage.setItem('odacuir_streak', streak);
      localStorage.setItem('odacuir_last_fed', lastFedTimestamp);

      // 播放 8-bit 吃東西音效
      playBeep(587, 'square', 0.1);
      setTimeout(() => playBeep(880, 'square', 0.2), 120);

      // 觸發吞食動畫 (持續 1.5 秒)
      triggerEatAnimation();

      checkCooldown();
      updateUI();
    }

    function triggerEatAnimation() {
      isEating = true;
      setTimeout(() => { isEating = false; }, 1500);
    }

    function updateUI() {
      document.getElementById('streak-count').innerText = streak;
      document.getElementById('pet-status').innerText = isCooldownActive() ? "HAPPY" : "SAD";
    }

    // 5. Canvas 點畫兔子與餵食動畫繪製核心
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function drawPixelBunny() {
      try {
        // 清空背景
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const isHappy = isCooldownActive();
        const bounce = isHappy ? Math.sin(animFrame * 0.1) * 4 : 0;
        
        // 外框
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);

        const WHITE = '#ffffff', GRAY = '#666666', BLACK = '#000000';
        const cx = 125, cy = 130 + bounce;

        // 兔子耳朵
        ctx.fillStyle = WHITE;
        ctx.fillRect(cx - 35, cy - 80, 20, 50);
        ctx.fillRect(cx + 15, cy - 80, 20, 50);
        ctx.fillStyle = GRAY;
        ctx.fillRect(cx - 30, cy - 75, 10, 40);
        ctx.fillRect(cx + 20, cy - 75, 10, 40);

        // 兔子身體與頭部
        ctx.fillStyle = WHITE;
        ctx.fillRect(cx - 45, cy - 35, 90, 70);
        ctx.fillRect(cx - 55, cy + 20, 110, 60);

        // 眼睛 (黑圓眼)
        ctx.fillStyle = BLACK;
        ctx.fillRect(cx - 25, cy - 15, 12, 12);
        ctx.fillRect(cx + 13, cy - 15, 12, 12);

        // 沒餵食時的流淚動畫
        if (!isHappy) {
          ctx.fillStyle = WHITE;
          const tearY = (animFrame * 2) % 30;
          ctx.fillRect(cx - 23, cy + 5 + tearY, 4, 6);
          ctx.fillRect(cx + 17, cy + 5 + tearY, 4, 6);
        }

        // 嘴巴 (餵食/開心/難過狀態切換)
        ctx.fillStyle = BLACK;
        if (isEating) {
          ctx.fillRect(cx - 10, cy + 5, 20, 15); // 張大嘴巴吃
        } else if (isHappy) {
          ctx.fillRect(cx - 8, cy + 8, 16, 4);  // 圓弧笑嘴
        } else {
          ctx.fillRect(cx - 8, cy + 12, 16, 3); // 難過嘴
        }

        // 餵食動畫（硬幣掉了進去）
        if (isEating) {
          ctx.fillStyle = WHITE;
          ctx.fillRect(cx - 10, cy - 40 - bounce, 20, 20); // 硬幣外框
          ctx.fillStyle = BLACK;
          ctx.fillRect(cx - 4, cy - 34 - bounce, 8, 8);    // 硬幣標記 'C'
        }

        animFrame++;
      } catch (err) {
        console.error("Render error:", err);
      }
      requestAnimationFrame(drawPixelBunny);
    }

    // 初始化頁面
    window.addEventListener('DOMContentLoaded', () => {
      checkCooldown();
      updateUI();
      drawPixelBunny();
    });
  </script>
</body>
</html>
