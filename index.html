<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ODACUIR FEED ME WITH A COIN A DAY</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --bg-color: #000000;
      --panel-bg: #111111;
      --border-color: #ffffff;
      --text-main: #ffffff;
      --text-dim: #888888;
      --btn-hover: #333333;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-y: auto;
      filter: grayscale(100%) contrast(150%);
    }

    .crt::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(255, 255, 255, 0.05) 50%);
      background-size: 100% 4px;
      z-index: 100;
      pointer-events: none;
    }

    .game-container {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    header {
      text-align: center;
      border: 2px solid var(--border-color);
      padding: 10px;
      width: 100%;
      background-color: var(--panel-bg);
      box-shadow: 4px 4px 0px var(--border-color);
    }

    h1 {
      font-size: 10px;
      line-height: 1.4;
      margin: 0;
      letter-spacing: 1px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 8px;
      border: 2px solid var(--border-color);
      padding: 8px;
      background: var(--panel-bg);
    }

    #canvas-container {
      position: relative;
      border: 3px solid var(--border-color);
      background-color: #000;
      box-shadow: 6px 6px 0px var(--border-color);
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    button {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--text-main);
      background-color: var(--bg-color);
      border: 2px solid var(--border-color);
      padding: 12px;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--border-color);
      transition: all 0.1s;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border-color);
    }

    button:disabled {
      color: var(--text-dim);
      border-color: var(--text-dim);
      box-shadow: 4px 4px 0px var(--text-dim);
      cursor: not-allowed;
    }

    .airdrop-btn {
      background-color: #ffffff;
      color: #000000;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0.6; }
    }

    /* 頁面內展示圖卡的區域 */
    #card-output-section {
      width: 100%;
      margin-top: 10px;
      border: 2px dashed var(--border-color);
      padding: 10px;
      background-color: var(--panel-bg);
      text-align: center;
    }

    #share-card-img {
      width: 100%;
      height: auto;
      border: 2px solid var(--border-color);
      margin-top: 8px;
      display: block;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 16px;
    }

    .modal-content {
      background-color: var(--panel-bg);
      border: 3px solid var(--border-color);
      padding: 16px;
      max-width: 380px;
      width: 100%;
      box-shadow: 8px 8px 0px var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 10px;
      text-align: center;
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 8px;
    }

    .info-text {
      font-size: 7px;
      line-height: 1.6;
      color: var(--text-main);
    }

    .warning-text {
      font-size: 6.5px;
      color: var(--text-dim);
      border: 1px solid var(--border-color);
      padding: 6px;
    }

    label {
      font-size: 7px;
      display: block;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 8px;
      background: #000;
      color: #fff;
      border: 2px solid var(--border-color);
      margin-bottom: 8px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

      <h1>ODACUIR FEED ME<br>WITH A COIN A DAY</h1>
    </header>

    </div>

    <div id="canvas-container">
      <canvas id="gameCanvas" width="250" height="250"></canvas>
    </div>

      <button id="feed-btn" onclick="tryFeed()">[ FEED PET ]</button>
